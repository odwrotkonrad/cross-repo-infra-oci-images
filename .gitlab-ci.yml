workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build-image
  - manifest-image
  - validate
  - release
  - trigger-image

variables:
  CI_LINUX_IMAGE: $CI_REGISTRY_IMAGE/ci-linux
  CI_LINUX_DIND_IMAGE: $CI_REGISTRY_IMAGE/ci-linux-dind
  CHE_VALIDATE_SPEC: error

#[why] one native build job per arch (qemu-emulated arm64 in one multi-arch build doubles the wall clock) building both targets of the multi-stage Dockerfile, each pushing only <sha>-<arch> tags; the manifest job then assembles the shared multi-arch tags. MR pipelines export registry cache only (no tags pushed)
.build-image:
  stage: build-image
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use --driver docker-container dind
    #[why] on a tag pipeline publish the immutable :vX.Y.Z consumers pin; else re-tag :latest as the version slot (harmless no-op)
    - VERSION_TAG="${CI_COMMIT_TAG:-latest}"
    #[why] etag of the latest che tarball -> CHE_REF build-arg: busts the Dockerfile che layer only when che re-published (unchanged che keeps the cached layer). wget not curl: the docker:27-cli job image is alpine/busybox (no curl)
    - CHE_REF="$(wget -S --spider -q -O /dev/null "https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/latest/che_latest_linux_amd64.tar.gz" 2>&1 | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}')"
    #[why] MR builds warm the shared registry cache only; tags publish from tag/main pipelines
    - if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then OUTPUT_ARGS="--output type=cacheonly"; else OUTPUT_ARGS="--push"; fi

build-ci-linux-image-amd64:
  extends: .build-image
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/ci-linux/Dockerfile"
        --target ci-linux
        --platform linux/amd64
        --build-arg "CHE_REF=$CHE_REF"
        --tag "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA-amd64"
        --cache-from "type=registry,ref=$CI_LINUX_IMAGE-cache"
        --cache-to "type=registry,ref=$CI_LINUX_IMAGE-cache,mode=max"
        $OUTPUT_ARGS
        "$CI_PROJECT_DIR"
    #[why] same builder, same layers: the dind target adds one cached docker-CLI layer on top
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/ci-linux/Dockerfile"
        --target ci-linux-dind
        --platform linux/amd64
        --build-arg "CHE_REF=$CHE_REF"
        --tag "$CI_LINUX_DIND_IMAGE:$CI_COMMIT_SHORT_SHA-amd64"
        --cache-from "type=registry,ref=$CI_LINUX_IMAGE-cache"
        --cache-from "type=registry,ref=$CI_LINUX_DIND_IMAGE-cache"
        --cache-to "type=registry,ref=$CI_LINUX_DIND_IMAGE-cache,mode=max"
        $OUTPUT_ARGS
        "$CI_PROJECT_DIR"

build-ci-linux-image-arm64:
  extends: .build-image
  tags:
    - saas-linux-small-arm64
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/ci-linux/Dockerfile"
        --target ci-linux
        --platform linux/arm64
        --build-arg "CHE_REF=$CHE_REF"
        --tag "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"
        --cache-from "type=registry,ref=$CI_LINUX_IMAGE-cache-arm64"
        --cache-to "type=registry,ref=$CI_LINUX_IMAGE-cache-arm64,mode=max"
        $OUTPUT_ARGS
        "$CI_PROJECT_DIR"
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/ci-linux/Dockerfile"
        --target ci-linux-dind
        --platform linux/arm64
        --build-arg "CHE_REF=$CHE_REF"
        --tag "$CI_LINUX_DIND_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"
        --cache-from "type=registry,ref=$CI_LINUX_IMAGE-cache-arm64"
        --cache-from "type=registry,ref=$CI_LINUX_DIND_IMAGE-cache-arm64"
        --cache-to "type=registry,ref=$CI_LINUX_DIND_IMAGE-cache-arm64,mode=max"
        $OUTPUT_ARGS
        "$CI_PROJECT_DIR"

#[what] assemble the shared multi-arch tags from the per-arch <sha>-<arch> pushes (registry-side, no daemon)
#[why] the legacy latest-arm64 alias stays refreshed so consumers pinned to it keep working through the transition
.manifest-image:
  stage: manifest-image
  image: docker:27-cli
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - VERSION_TAG="${CI_COMMIT_TAG:-latest}"

manifest-images:
  extends: .manifest-image
  needs: [build-ci-linux-image-amd64, build-ci-linux-image-arm64]
  script:
    - docker buildx imagetools create
        -t "$CI_LINUX_IMAGE:latest" -t "$CI_LINUX_IMAGE:$VERSION_TAG" -t "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA"
        "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA-amd64" "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"
    - docker buildx imagetools create -t "$CI_LINUX_IMAGE:latest-arm64" "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"
    - docker buildx imagetools create
        -t "$CI_LINUX_DIND_IMAGE:latest" -t "$CI_LINUX_DIND_IMAGE:$VERSION_TAG" -t "$CI_LINUX_DIND_IMAGE:$CI_COMMIT_SHORT_SHA"
        "$CI_LINUX_DIND_IMAGE:$CI_COMMIT_SHORT_SHA-amd64" "$CI_LINUX_DIND_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"
    - docker buildx imagetools create -t "$CI_LINUX_DIND_IMAGE:latest-arm64" "$CI_LINUX_DIND_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"

#[why] self-bootstrapping: this repo's own image may not exist yet (chicken/egg), so bootstrap from a minimal debian and fetch the same prebuilt che/lefthook the image bakes (no slow CGO compile of che)
validate-pre-commit-all:
  stage: validate
  needs: []
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make zsh git curl ca-certificates
    - export $(grep -vE '^\s*(#|$)' ci/tool-versions.env | xargs)
    - che_base="https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/latest"
    - curl -fsSL --connect-timeout 30 --retry 10 --retry-delay 30 --retry-all-errors -o /tmp/che.tar.gz "${che_base}/che_latest_linux_amd64.tar.gz"
    - tar -xz -C /usr/local/bin -f /tmp/che.tar.gz che
    - curl --connect-timeout 30 --retry 10 --retry-delay 30 --retry-all-errors -fsSL -o /usr/local/bin/lefthook "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
    - echo "${LEFTHOOK_SHA256_LINUX_AMD64}  /usr/local/bin/lefthook" | sha256sum -c -
    - chmod +x /usr/local/bin/lefthook
    - mkdir -p ~/.config/lefthook
    - '[ -f ~/.config/lefthook/lefthook.yml ] || printf "min_version: 2.1.9\n" > ~/.config/lefthook/lefthook.yml'
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

#[why] auto-tag vX.Y.Z on main; the tag pipeline rebuilds the image and publishes the immutable :vX.Y.Z consumers pin
release:
  stage: release
  image: $CI_LINUX_IMAGE:latest
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script:
    - NEXT=$(sh ci/next-version.sh)
    - echo "releasing $NEXT"
    - glab release create "$NEXT" --name "oci-images $NEXT" --ref "$CI_COMMIT_SHA" --notes "oci-images $NEXT"

#[why] chain a che release into a sandbox re-bake: go-modules main -> here (BUILD_ALL_IMAGES) -> restricted/sandbox, so the published sandbox image re-bakes the fresh che; also fires on this repo's own default-branch pipelines. no needs: stage ordering already puts it after the ci-linux builds
rebuild-sandbox-image:
  stage: trigger-image
  rules:
    - if: $BUILD_ALL_IMAGES
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  inherit:
    variables: false
  variables:
    BUILD_SANDBOX_IMAGE: "true"
  trigger:
    project: konradodwrot/infra/sandbox
    branch: main
    forward:
      yaml_variables: true
      pipeline_variables: false
