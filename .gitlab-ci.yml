include:
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file: consumer-repo-config/ci/templates/EmitEvents.gitlab-ci.yml
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file:
      - consumer-repo-config/files-generation/templates/FilesTrackedVerify.gitlab-ci.yml
      - consumer-repo-config/ci/templates/UpstreamEnvDrift.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitChanged.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitAll.gitlab-ci.yml
    inputs:
      image: $CI_LINUX_IMAGE:latest

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#[why] retry infrastructure flakes (image pulls, runner/network, stuck jobs) twice; script failures never retry
#[why] a superseded pipeline holds pods for a commit nobody will merge: cancel it and let
#   the autoscaler release the node. jobs with an external side effect opt out individually
default:
  interruptible: true
  tags:
    - gke-linux-amd64
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure

stages:
  - validate
  - build-image
  - build-image-dind
  - release
  - trigger-image

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  ARTIFACT_REGISTRY_PROXY_DOCKERHUB: $GRP_KO_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB
  ARTIFACT_REGISTRY_PROXY_GCR: $GRP_KO_VAR_ARTIFACT_REGISTRY_PROXY_GCR
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  AI_TOOLS_CONFIGS_REF: $GRP_KO_VAR_AI_TOOLS_CONFIGS_REF
  CENTRALIZED_ASSETS_GENERIC_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:latest
  CI_LINUX_IMAGE: $ARTIFACT_REGISTRY/ci-linux
  CI_LINUX_DIND_IMAGE: $ARTIFACT_REGISTRY/ci-linux-dind
  CHE_IMAGE: $ARTIFACT_REGISTRY/che
  CHE_VALIDATE_SPEC: error

#[why] one multi-arch buildx build per image (arm64 qemu-emulated via binfmt), pushing the multi-arch manifest tags directly; the dind image is a target of the same Dockerfile and builds after the base so its registry cache is warm. MR pipelines export registry cache only (no tags pushed)
.build-image:
  stage: build-image
  image: $ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/docker:27-cli
  services:
    - name: $ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - docker context create dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use --driver docker-container dind
    #[why] pulled explicitly, because the daemon performing it holds no credentials and cannot be
    #   given any: registry auth is client-side, sent per request as a header, and the daemon reads
    #   no config of its own. `docker pull` sends it, the implicit pull behind `docker run` does
    #   not, so that one was denied. after this the image is local and the run needs no registry
    - docker pull $ARTIFACT_REGISTRY_PROXY_DOCKERHUB/tonistiigi/binfmt
    - docker run --privileged --rm $ARTIFACT_REGISTRY_PROXY_DOCKERHUB/tonistiigi/binfmt --install arm64
    #[why] on a tag pipeline publish the immutable :vX.Y.Z consumers pin; else re-tag :latest as the version slot (harmless no-op)
    - VERSION_TAG="${CI_COMMIT_TAG:-latest}"
    #[why] resolve the newest released che, skipping 0.0.0-mr* prereleases: the version keys the Dockerfile's che
    #   layer, so a release busts it and an unchanged che keeps the cache. wget not curl, sed not jq: the
    #   docker:27-cli job image is alpine/busybox
    - CHE_VERSION="$(wget -qO- "https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages?package_name=che&package_type=generic&order_by=created_at&sort=desc&per_page=100" | tr ',' '\n' | sed -n 's/.*"version":"\([0-9][0-9.]*\)".*/\1/p' | sed -n '1p')"
    - test -n "$CHE_VERSION"
    - CHE_PIN_VERSION="$(sed -n 's#^GO_MODULES_CHE_REF=che/v##p' .repo/upstream.env)"
    - test -n "$CHE_PIN_VERSION"
    - if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then OUTPUT_ARGS="--output type=cacheonly"; else OUTPUT_ARGS="--push"; fi

build-ci-linux-image:
  extends: .build-image
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
      changes:
        - ci/**/*
        - templates/**/*
        - .gitlab-ci.yml
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/ci-linux/Dockerfile"
        --target ci-linux
        --platform linux/amd64,linux/arm64
        --provenance=false
        --build-arg "BASE_IMAGE=$ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/debian:bookworm-slim"
        --build-arg "CHE_VERSION=$CHE_VERSION"
        --tag "$CI_LINUX_IMAGE:$VERSION_TAG"
        --tag "$CI_LINUX_IMAGE:latest"
        --tag "$CI_LINUX_IMAGE:latest-arm64"
        --tag "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA"
        --cache-from "type=registry,ref=$CI_LINUX_IMAGE-cache"
        --cache-to "type=registry,ref=$CI_LINUX_IMAGE-cache,mode=max"
        $OUTPUT_ARGS
        "$CI_PROJECT_DIR"

build-che-image:
  extends: .build-image
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
      changes:
        - ci/che/**/*
        - .repo/upstream.env
        - .gitlab-ci.yml
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/che/Dockerfile"
        --target che
        --platform linux/amd64,linux/arm64
        --provenance=false
        --build-arg "BUILDER_IMAGE=$ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/alpine:3"
        --build-arg "BASE_IMAGE=$ARTIFACT_REGISTRY_PROXY_GCR/distroless/static-debian13:nonroot"
        --build-arg "CHE_VERSION=$CHE_PIN_VERSION"
        --tag "$CHE_IMAGE:v$CHE_PIN_VERSION"
        --tag "$CHE_IMAGE:latest"
        --tag "$CHE_IMAGE:$CI_COMMIT_SHORT_SHA"
        --cache-from "type=registry,ref=$CHE_IMAGE-cache"
        --cache-to "type=registry,ref=$CHE_IMAGE-cache,mode=max"
        $OUTPUT_ARGS
        "$CI_PROJECT_DIR"

build-ci-linux-dind-image:
  extends: .build-image
  stage: build-image-dind
  needs:
    - build-ci-linux-image
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
      changes:
        - ci/**/*
        - templates/**/*
        - .gitlab-ci.yml
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/ci-linux/Dockerfile"
        --target ci-linux-dind
        --platform linux/amd64,linux/arm64
        --provenance=false
        --build-arg "BASE_IMAGE=$ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/debian:bookworm-slim"
        --build-arg "CHE_VERSION=$CHE_VERSION"
        --tag "$CI_LINUX_DIND_IMAGE:$VERSION_TAG"
        --tag "$CI_LINUX_DIND_IMAGE:latest"
        --tag "$CI_LINUX_DIND_IMAGE:latest-arm64"
        --tag "$CI_LINUX_DIND_IMAGE:$CI_COMMIT_SHORT_SHA"
        --cache-from "type=registry,ref=$CI_LINUX_IMAGE-cache"
        --cache-from "type=registry,ref=$CI_LINUX_DIND_IMAGE-cache"
        --cache-to "type=registry,ref=$CI_LINUX_DIND_IMAGE-cache,mode=max"
        $OUTPUT_ARGS
        "$CI_PROJECT_DIR"

#[why] auto-tag vX.Y.Z on main; the tag pipeline rebuilds the image and publishes the immutable :vX.Y.Z consumers pin
#[why] not interruptible: it cuts a GitLab release, and a half-created tag is worse than a slow one
release:
  tags:
    - gke-linux-amd64-small
  interruptible: false
  stage: release
  image: $CI_LINUX_IMAGE:latest
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ci/**/*
        - templates/**/*
        - .gitlab-ci.yml
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script:
    - NEXT_VERSION=$(sh ci/next-version.sh)
    - echo "releasing $NEXT_VERSION"
    - glab release create "$NEXT_VERSION" --name "oci-images $NEXT_VERSION" --ref "$CI_COMMIT_SHA" --notes "oci-images $NEXT_VERSION"

emit-events:
  extends: .emit-events
  stage: trigger-image

