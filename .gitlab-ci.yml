workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build-image
  - validate
  - release

variables:
  CI_LINUX_IMAGE: $CI_REGISTRY_IMAGE/ci-linux
  DEV_SANDBOX_IMAGE: $CI_REGISTRY_IMAGE/dev-sandbox
  CHE_VALIDATE_SPEC: error

#[why] one job per arch: qemu-emulated arm64 in one multi-arch build doubles the wall clock; on this repo's own pipelines amd64 ci-linux is the only automatic build, the rest are manual. BUILD_ALL_IMAGES (che release trigger) runs all four; BUILD_DEV_SANDBOX_IMAGES (configs main trigger) runs the two dev-sandbox jobs only. arm64 pushes -arm64 suffixed tags (a single-arch push to a shared tag would clobber the other arch's manifest)
.build-image:
  stage: build-image
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use --driver docker-container dind
    #[why] on a tag pipeline publish the immutable :vX.Y.Z consumers pin; else re-tag :latest as the version slot (harmless no-op)
    - VERSION_TAG="${CI_COMMIT_TAG:-latest}"
    #[why] etag of the latest che tarball -> CHE_REF build-arg: busts the Dockerfile che layer only when che re-published (unchanged che keeps the cached layer). wget not curl: the docker:27-cli job image is alpine/busybox (no curl)
    - CHE_REF="$(wget -S --spider -q -O /dev/null "https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/latest/che_latest_linux_amd64.tar.gz" 2>&1 | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}')"

build-ci-linux-image-amd64:
  extends: .build-image
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $BUILD_DEV_SANDBOX_IMAGES
      when: never
    - if: $BUILD_ALL_IMAGES
    - if: $CI_COMMIT_TAG
    - changes:
        - ci/ci-linux/Dockerfile
        - ci/tool-versions.env
        - ci/terraform-providers.tf
        - ci/terraform.lock.hcl
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/ci-linux/Dockerfile"
        --platform linux/amd64
        --build-arg "CHE_REF=$CHE_REF"
        --tag "$CI_LINUX_IMAGE:$VERSION_TAG"
        --tag "$CI_LINUX_IMAGE:latest"
        --tag "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA"
        --cache-from "type=registry,ref=$CI_LINUX_IMAGE-cache"
        --cache-to "type=registry,ref=$CI_LINUX_IMAGE-cache,mode=max"
        --push
        "$CI_PROJECT_DIR"

#[why] qemu on the shared runners is fine for ci-linux (downloads, no compile): keep it there with buildx
build-ci-linux-image-arm64:
  extends: .build-image
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $BUILD_DEV_SANDBOX_IMAGES
      when: never
    - if: $BUILD_ALL_IMAGES
    - when: manual
      allow_failure: true
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/ci-linux/Dockerfile"
        --platform linux/arm64
        --build-arg "CHE_REF=$CHE_REF"
        --tag "$CI_LINUX_IMAGE:$VERSION_TAG-arm64"
        --tag "$CI_LINUX_IMAGE:latest-arm64"
        --tag "$CI_LINUX_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"
        --cache-from "type=registry,ref=$CI_LINUX_IMAGE-cache-arm64"
        --cache-to "type=registry,ref=$CI_LINUX_IMAGE-cache-arm64,mode=max"
        --push
        "$CI_PROJECT_DIR"

.build-dev-sandbox:
  extends: .build-image
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $BUILD_ALL_IMAGES
    - if: $BUILD_DEV_SANDBOX_IMAGES
    - if: $CI_COMMIT_TAG
    - changes:
        - ci/dev-sandbox/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

build-dev-sandbox-image-amd64:
  extends: .build-dev-sandbox
  needs: []
  script:
    #[why] latest commits touching tools/zsh + che.yml -> CONFIGS_REF build-arg: busts the che run layer only when the sourced zsh profile itself changed, not on every configs push, no --no-cache
    - CONFIGS_REF="$(wget -qO- 'https://gitlab.com/api/v4/projects/konradodwrot%2Fconfigs/repository/commits?path=tools/zsh&per_page=1' | sed -n 's/.*"id":"\([0-9a-f]*\)".*/\1/p')-$(wget -qO- 'https://gitlab.com/api/v4/projects/konradodwrot%2Fconfigs/repository/commits?path=che.yml&per_page=1' | sed -n 's/.*"id":"\([0-9a-f]*\)".*/\1/p')"
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/dev-sandbox/Dockerfile"
        --platform linux/amd64
        --build-arg "CHE_REF=$CHE_REF"
        --build-arg "CONFIGS_REF=$CONFIGS_REF"
        --tag "$DEV_SANDBOX_IMAGE:$VERSION_TAG"
        --tag "$DEV_SANDBOX_IMAGE:latest"
        --tag "$DEV_SANDBOX_IMAGE:$CI_COMMIT_SHORT_SHA"
        --push
        "$CI_PROJECT_DIR"

#[why] the dev-sandbox bake (brew + che run) is qemu-hostile: run it natively on a gitlab-hosted arm64 runner (saas-linux-medium-arm64), same dind shape as amd64
build-dev-sandbox-image-arm64:
  extends: .build-dev-sandbox
  tags: [saas-linux-medium-arm64]
  needs: []
  script:
    #[why] latest commits touching tools/zsh + che.yml -> CONFIGS_REF build-arg: busts the che run layer only when the sourced zsh profile itself changed, not on every configs push
    - CONFIGS_REF="$(wget -qO- 'https://gitlab.com/api/v4/projects/konradodwrot%2Fconfigs/repository/commits?path=tools/zsh&per_page=1' | sed -n 's/.*"id":"\([0-9a-f]*\)".*/\1/p')-$(wget -qO- 'https://gitlab.com/api/v4/projects/konradodwrot%2Fconfigs/repository/commits?path=che.yml&per_page=1' | sed -n 's/.*"id":"\([0-9a-f]*\)".*/\1/p')"
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/dev-sandbox/Dockerfile"
        --platform linux/arm64
        --build-arg "CHE_REF=$CHE_REF"
        --build-arg "CONFIGS_REF=$CONFIGS_REF"
        --tag "$DEV_SANDBOX_IMAGE:$VERSION_TAG-arm64"
        --tag "$DEV_SANDBOX_IMAGE:latest-arm64"
        --tag "$DEV_SANDBOX_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"
        --push
        "$CI_PROJECT_DIR"

#[why] self-bootstrapping: this repo's own image may not exist yet (chicken/egg), so bootstrap from a minimal debian and fetch the same prebuilt che/lefthook the image bakes (no slow CGO compile of che)
validate-pre-commit-all:
  stage: validate
  needs: []
  rules:
    - if: $BUILD_DEV_SANDBOX_IMAGES
      when: never
    - when: on_success
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make zsh git curl ca-certificates
    - export $(grep -vE '^\s*(#|$)' ci/tool-versions.env | xargs)
    - che_base="https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/latest"
    - curl -fsSL -o /tmp/che.tar.gz "${che_base}/che_latest_linux_amd64.tar.gz"
    - tar -xz -C /usr/local/bin -f /tmp/che.tar.gz che
    - curl -fsSL -o /usr/local/bin/lefthook "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
    - echo "${LEFTHOOK_SHA256_LINUX_AMD64}  /usr/local/bin/lefthook" | sha256sum -c -
    - chmod +x /usr/local/bin/lefthook
    - mkdir -p ~/.config/lefthook
    - '[ -f ~/.config/lefthook/lefthook.yml ] || printf "min_version: 2.1.9\n" > ~/.config/lefthook/lefthook.yml'
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

#[why] auto-tag vX.Y.Z on main; the tag pipeline rebuilds the image and publishes the immutable :vX.Y.Z consumers pin
release:
  stage: release
  image: $CI_LINUX_IMAGE:latest
  needs: []
  rules:
    - if: $BUILD_DEV_SANDBOX_IMAGES
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script:
    - NEXT=$(sh ci/next-version.sh)
    - echo "releasing $NEXT"
    - glab release create "$NEXT" --name "oci-images $NEXT" --ref "$CI_COMMIT_SHA" --notes "oci-images $NEXT"
